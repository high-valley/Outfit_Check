name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/new-session-mdgdfe]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set baseUrl to repository name
        run: |
          node -e "
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('app.json'));
          a.expo.experiments={...a.expo.experiments,baseUrl:'/'+process.env.GITHUB_REPOSITORY.split('/')[1]};
          fs.writeFileSync('app.json',JSON.stringify(a,null,2));
          "
      - run: npx expo export -p web
      # 直接URLを開いても動くように、SPAのフォールバックを置く
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
